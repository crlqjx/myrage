[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "myrage"
version = "0.0.17"
description = "A simple class to instanciate a tor process and run http requests behind it"
authors = [
	{ name = "Cyril Quijoux" }
]
keywords = ['tor', 'requests', 'http', 'https']

dependencies = [
	"requests",
	"requests[socks]",
	"stem",
	"psutil",
]

[tool.ruff.lint]
extend-select = ["E"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

[tool.setuptools.packages.find]
where = ['src']
