[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "myrage"
version = "0.0.8"
description = "A simple class to instanciate a tor process and run http requests behind it"
authors = [
	{ name = "Cyril Quijoux" }
]
keywords = ['tor', 'requests', 'http', 'https']

dependencies = [
	"requests",
	"requests[socks]",
	"stem",
	"psutil",
]

[tools.setuptools]
package-dir = {"" = "src"}
